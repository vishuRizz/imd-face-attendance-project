apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'expo-module'

android {
    compileSdk 35
    defaultConfig {
        minSdk 24
        targetSdk 35
    }
    namespace "expo.modules.faceml"

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    // ONNX Runtime for face detection + recognition
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.18.0'

    // expo-modules-core is provided by the host app — compile-only
    compileOnly project(':expo-modules-core')
    compileOnly 'com.facebook.react:react-android'
}
